services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow || exit 1"]
      interval: 10s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"
    restart: always

  airflow-init:
    image: bikeshare-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "airflow db check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - secrets.ini
    entrypoint: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./secrets.ini:/opt/airflow/secrets.ini
      - ./templates:/opt/airflow/templates

  airflow-webserver:
    image: bikeshare-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - secrets.ini
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CONTAINER_PORT}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./secrets.ini:/opt/airflow/secrets.ini
      - ./templates:/opt/airflow/templates
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    command: webserver
    restart: always

  airflow-scheduler:
    image: bikeshare-airflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    env_file:
      - secrets.ini
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./dbt_transform:/opt/airflow/dbt_transform
      - ./configs:/opt/airflow/configs
      - ./secrets.ini:/opt/airflow/secrets.ini
      - ./templates:/opt/airflow/templates
    command: scheduler
    restart: always

  # airflow-worker:
