---
x-airflow-common:
  &airflow-common
  image: bikeshare-pipeline:1.0
  env_file:
    &airflow-common-env
    - secrets.ini
  volumes:
    &airflow-common-volumes
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./configs:/opt/airflow/configs
    - ./secrets.ini:/opt/airflow/secrets.ini
    - ./templates:/opt/airflow/templates
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow || exit 1"]
      interval: 10s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"
    restart: always
  
  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "6379:6379"
    restart: always

  airflow-init:
    image: bikeshare-pipeline:1.0
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - secrets.ini
    entrypoint: >
      bash -c "
        airflow db migrate && 
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./secrets.ini:/opt/airflow/secrets.ini
      - ./templates:/opt/airflow/templates

  airflow-apiserver:
    <<: *airflow-common
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CONTAINER_PORT}/api/v2/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    command: api-server
    restart: always
  

  airflow-scheduler:
    <<: *airflow-common
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:8974/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    command: scheduler
    restart: always

  
  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      # airflow-scheduler:
      #   condition: service_healthy
    command: dag-processor
    restart: always
  
  airflow-worker:
    <<: *airflow-common
    environment:
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      # airflow-scheduler:
      #   condition: service_healthy
    command: celery worker
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      # airflow-scheduler:
      #   condition: service_healthy
    command: triggerer
    restart: always

volumes:
  postgres-db-volume:

