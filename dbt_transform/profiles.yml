dbt_bikeshare_profile:
  target: "{{ env_var('DBT_ENV_SECRET_TARGET_SCHEMA') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_SCHEMA') }}"
      threads: 4
      client_session_keep_alive: False
      connect_timeout: 300