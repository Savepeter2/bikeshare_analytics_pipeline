apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bikeshare-dbt-secrets
  namespace: bikeshare-dev-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: bikeshare-dbt-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: bikeshare/dbt/snowflake