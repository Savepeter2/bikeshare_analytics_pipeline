name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Install Helm
        uses: azure/setup-helm@v3
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name bikeshare-staging --region us-east-1
      
      - name: Deploy Airflow via Helm
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update
          helm upgrade --install airflow apache-airflow/airflow \
            -f kubernetes/staging-values.yaml \
            --set images.airflow.repository=${{ secrets.ECR_REGISTRY }}/bikeshare-airflow \
            --set images.airflow.tag=${{ github.sha }} \
            --namespace airflow-staging \
            --create-namespace \
            --wait
      
      - name: Sync DAGs to S3
        run: |
          aws s3 sync ./dags/ s3://bikeshare-airflow-staging/dags/ \
            --delete --exclude "*.pyc" --exclude "__pycache__/*"
      
      - name: Run smoke tests
        run: poetry run pytest tests/e2e/smoke_tests.py
      
      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}